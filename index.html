<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGAP - Login Monitoring Salinitas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-terestrial {
            background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.5), rgba(13, 148, 136, 0.65)), 
                              url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1600&auto=format&fit=crop');
            background-size: cover; background-position: center;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-terestrial">

    <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl overflow-hidden border border-emerald-100">
        <div class="pt-8 pb-4 px-8 text-center border-b border-slate-100">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 rounded-2xl mb-3 text-emerald-700 font-bold text-2xl shadow-inner border border-emerald-200">
                <i class="fa-solid fa-plant-wilt"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-800">SIGAP</h1>
            <p class="text-xs text-emerald-600 font-semibold uppercase tracking-wider mt-0.5">Monitoring Salinitas Real-Time</p>
            <p class="text-xs text-slate-500 mt-1">Eretan Wetan, Indramayu</p>
        </div>

        <form id="loginForm" class="p-8 space-y-4" onsubmit="handleLogin(event)">
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Username / Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><i class="fa-regular fa-user"></i></div>
                    <input type="text" id="username" placeholder="Masukkan email/username" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-lock"></i></div>
                    <input type="password" id="password" placeholder="••••••••" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <div>
                <label for="role" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Login Sebagai Stakeholder</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-emerald-600"><i class="fa-solid fa-user-shield"></i></div>
                    <select id="role" class="w-full pl-10 pr-4 py-2.5 bg-emerald-50 border border-emerald-200 text-slate-800 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="penyuluh">👨‍🌾 Penyuluh Pertanian</option>
                        <option value="peneliti">🔬 Peneliti / Akademisi</option>
                        <option value="dinas">🏛️ Dinas Pertanian Indramayu</option>
                        <option value="asuransi">📋 Petugas Asuransi AUTP</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold rounded-xl shadow-lg shadow-emerald-700/30 transition flex items-center justify-center gap-2">
                <span>Masuk Ke Sistem</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="bg-slate-50 px-8 py-4 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-600">Belum punya akun? <a href="#" class="font-bold text-emerald-700 hover:underline">Daftar / Bikin Akun Baru</a></p>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const selectedRole = document.getElementById('role').value;
            const username = document.getElementById('username').value;
            
            // Simpan Peran dan Nama User di Browser Storage
            localStorage.setItem('teras_role', selectedRole);
            localStorage.setItem('teras_username', username);
            
            // Pindah ke Dashboard
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
